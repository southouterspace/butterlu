name: Set up site
description: Node from .nvmrc, npm ci in site/, and Chromium for e2e.
inputs:
  browsers:
    description: Install Chromium for the e2e suite.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: site/package-lock.json
    - run: npm ci
      shell: bash
      working-directory: site
    - if: inputs.browsers == 'true'
      run: npx e2e-web install chromium --with-deps
      shell: bash
      working-directory: site
