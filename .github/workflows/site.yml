name: site

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: site-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  E2E_TELEMETRY_DISABLED: '1'
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-site
      - name: Build (astro check, astro build, lint dist)
        run: npm run build
        working-directory: site
      - name: Type-check the Worker
        run: npm run check:worker
        working-directory: site
      - name: e2e against wrangler dev
        run: npx e2e run --reporter list,junit
        working-directory: site
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-local
          path: site/.e2e
          if-no-files-found: warn
          retention-days: 7

  preview:
    needs: check
    # Repository secrets never reach fork pull requests.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets to get preview URLs. See site/README.md."
            exit 1
          fi
      - uses: ./.github/actions/setup-site
      - run: npm run build
        working-directory: site
      - id: deploy
        name: Create or update the Preview
        working-directory: site
        run: |
          set -o pipefail
          out="$(npx wrangler preview --name "$PREVIEW_NAME" --message "${GITHUB_SHA::7}" --json)"
          printf '%s\n' "$out"
          echo "url=$(printf '%s' "$out" | jq -er '.preview.urls[0]')" >> "$GITHUB_OUTPUT"
      - name: Wait for the Preview to answer
        run: |
          for i in $(seq 1 30); do
            curl --fail --silent --show-error "$URL/api/health" && exit 0
            sleep 2
          done
          exit 1
        env:
          URL: ${{ steps.deploy.outputs.url }}
      - name: e2e against the Preview
        id: e2e
        run: npx e2e run --reporter list,junit,markdown
        working-directory: site
        env:
          E2E_BASE_URL: ${{ steps.deploy.outputs.url }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Post the Preview URL
        if: ${{ !cancelled() && steps.deploy.outputs.url != '' }}
        run: |
          {
            echo "### Preview"
            echo
            echo "**$URL**"
            echo
            echo "Commit \`${HEAD_SHA::7}\` · e2e: **$E2E_OUTCOME** · [run]($RUN_URL)"
          } > preview-comment.md
          .github/scripts/sticky-comment.sh "${{ github.event.pull_request.number }}" butterlu-preview preview-comment.md
          cat preview-comment.md >> "$GITHUB_STEP_SUMMARY"
        env:
          URL: ${{ steps.deploy.outputs.url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-preview
          path: site/.e2e
          if-no-files-found: warn
          retention-days: 7

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-site
        with:
          browsers: 'false'
      - name: Delete the Preview
        working-directory: site
        run: npx wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
