name: release

# Production changes only through a published GitHub Release. This is the only
# place the production token exists: an account API token scoped to the
# butterlu-site Worker, stored on the `production` environment. Stage deploys
# from stage.yml on every push to main, with its own stage-only token.
on:
  release:
    types: [published]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      E2E_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Release commit is on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install packages
        run: |
          for i in 1 2 3; do bun install --frozen-lockfile && break; [ "$i" = 3 ] && exit 1; sleep $((i * 10)); done
      # The test browser itself comes from Playwright's CDN, not Ubuntu's mirrors.
      - name: Install the test browser (same as stage.yml)
        working-directory: apps/site
        run: |
          for i in 1 2 3; do bunx e2e-web install chromium && break; [ "$i" = 3 ] && exit 1; sleep $((i * 10)); done
          # GitHub's Ubuntu image ships Google Chrome, so the system libraries Chromium needs
          # are already there. apt (Ubuntu's mirrors, which go down on their own schedule)
          # runs only for a library that is actually missing, and never for long.
          bins=$(find "${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}" -type f \( -name chrome -o -name chrome-headless-shell \) 2>/dev/null || true)
          missing=$(for b in $bins; do ldd "$b"; done 2>/dev/null | grep 'not found' | sort -u || true)
          if [ -z "$bins" ] || [ -n "$missing" ]; then
            echo "Chromium is missing system libraries:"
            echo "$missing"
            timeout 600 bunx e2e-web install chromium --with-deps
          else
            echo "Chromium has every system library it needs; skipping apt."
          fi
      - id: deploy
        name: Validate, deploy, smoke-test production
        working-directory: apps/site
        run: |
          set -o pipefail
          bun run deploy:production | tee deploy.log
          echo "url=$(sed -n 's/^deploy-summary //p' deploy.log | jq -r .url)" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-production
          path: apps/site/.e2e
          if-no-files-found: warn
          retention-days: 30

