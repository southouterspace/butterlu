name: release

# Production changes only through a published GitHub Release. This is the one
# workflow in the repo, and the only place the production token exists: an
# account API token scoped to the butterlu-site Worker, stored on the
# `production` environment. Agents build, check and deploy stage in their own
# sessions with a token that cannot touch this Worker.
on:
  release:
    types: [published]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      E2E_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Release commit is on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npx e2e-web install chromium --with-deps
        working-directory: site
      - id: deploy
        name: Validate, deploy, smoke-test production
        working-directory: site
        run: |
          set -o pipefail
          npm run deploy:production | tee deploy.log
          echo "url=$(sed -n 's/^deploy-summary //p' deploy.log | jq -r .url)" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-production
          path: site/.e2e
          if-no-files-found: warn
          retention-days: 30
