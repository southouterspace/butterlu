name: deploy

# The merge to main is the one irreversible click, and a human holds it.
# This only updates the workers.dev host; butterlu.com DNS is not pointed here.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/**', '.nvmrc']

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-site
        with:
          browsers: 'false'
      - run: npm run build
        working-directory: site
      - run: npx wrangler deploy --message "${GITHUB_SHA::7}"
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
